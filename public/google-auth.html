<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acessando Conta Google...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.02);
      max-width: 400px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }
    .logo {
      height: 48px;
      width: 48px;
      margin-bottom: 24px;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0;
      line-height: 1.5;
    }
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      text-align: left;
      word-break: break-word;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="loader"></div>
    <svg class="logo" viewBox="0 0 24 24" id="google-logo">
      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.37 7.37 24 12 24z" />
      <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.97 0 12s.45 3.85 1.24 5.42l4.04-3.15z" />
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.63 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
    </svg>
    <h2 id="title">Conectando ao Google</h2>
    <p id="status">Por favor, aguarde enquanto iniciamos o login...</p>
    <div class="error-box" id="error-container"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const statusEl = document.getElementById("status");
    const errorContainer = document.getElementById("error-container");
    const loader = document.getElementById("loader");

    function showError(message) {
      statusEl.innerText = "Falha na autenticação.";
      errorContainer.innerText = message;
      errorContainer.style.display = "block";
      loader.style.display = "none";
    }

    async function startAuth() {
      try {
        statusEl.innerText = "Buscando configurações de segurança...";
        const response = await fetch("/api/firebase-config");
        if (!response.ok) {
          throw new Error("Não foi possível carregar as configurações do Firebase a partir do servidor.");
        }
        
        const firebaseConfig = await response.json();
        statusEl.innerText = "Inicializando conexão segura...";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        statusEl.innerText = "Aguardando seleção de conta Google...";
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        const result = await signInWithPopup(auth, provider);
        statusEl.innerText = "Validando credenciais...";
        
        const credential = GoogleAuthProvider.credentialFromResult(result);
        if (!credential || !credential.idToken) {
          throw new Error("Não foi possível extrair o ID Token do Google.");
        }

        if (window.opener) {
          statusEl.innerText = "Sincronizando com o aplicativo...";
          window.opener.postMessage({
            type: "GOOGLE_AUTH_SUCCESS",
            idToken: credential.idToken,
            uid: result.user.uid,
            email: result.user.email,
            displayName: result.user.displayName,
            photoURL: result.user.photoURL
          }, "*");
          
          statusEl.innerText = "Sucesso! Esta janela fechará em instantes.";
          setTimeout(() => {
            window.close();
          }, 800);
        } else {
          showError("Janela principal não encontrada para repassar o acesso.");
        }
      } catch (error) {
        console.error("Popup Auth Error:", error);
        let errorMsg = error.message || "Erro desconhecido.";
        if (error.code === "auth/popup-closed-by-user") {
          errorMsg = "A janela de login do Google foi fechada antes da conclusão.";
        } else if (error.code === "auth/network-request-failed") {
          errorMsg = "Erro de rede. Verifique sua conexão com a internet.";
        } else if (error.code === "auth/unauthorized-domain") {
          errorMsg = "Este domínio não está autorizado nas configurações do console do Firebase.";
        }
        
        if (window.opener) {
          window.opener.postMessage({
            type: "GOOGLE_AUTH_ERROR",
            error: errorMsg
          }, "*");
        }
        showError(errorMsg);
      }
    }

    startAuth();
  </script>
</body>
</html>
